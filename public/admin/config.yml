backend:
  name: github
  repo: https://github.com/fpjsilverwolve-netizen/astro-blog-frank
  branch: main
  base_url: https://broken-wave-2196.fpjsilverwolve.workers.dev
  auth_endpoint: auth

media_folder: "public/fonts"
public_folder: "/public"

collections:
  - name: "blog"
    label: "博客文章"
    folder: "src/content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "文章标题", name: "title", widget: "string" }
      - { label: "发布时间", name: "pubDate", widget: "datetime" }
      - { label: "文章摘要", name: "description", widget: "text" }
      - { label: "文章正文", name: "body", widget: "markdown" }
